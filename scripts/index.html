<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Coach Pro</title>
  </head>
  <body>
    <script>
      window["ai_edge_gallery_get_result"] = async (data) => {
        try {
          const jsonData = JSON.parse(data);
          const action = jsonData.action;
          const workoutName = jsonData.workout_name ? jsonData.workout_name.toLowerCase() : null;

          if (!action || !workoutName) {
             return JSON.stringify({ error: "Missing required fields: action and workout_name." });
          }

          let db = JSON.parse(localStorage.getItem("workout_db_pro") || '{"logs": []}');
          const today = new Date().toISOString().split('T')[0];

          if (action === "log_workout") {
            if (!jsonData.workout_data) {
                return JSON.stringify({ error: "No workout data provided to log." });
            }
            
            const processedExercises = jsonData.workout_data.map(ex => ({
                name: ex.name || "Unknown Exercise",
                weight: ex.weight || null,
                reps: ex.reps || null,
                sets: ex.sets || null,
                duration_or_notes: ex.duration_or_notes || null
            }));

            const newLog = {
                date: today,
                workout_name: workoutName,
                exercises: processedExercises
            };
            
            db.logs.push(newLog);
            localStorage.setItem("workout_db_pro", JSON.stringify(db));
            
            return JSON.stringify({ 
              success: true, 
              message: `Successfully logged ${workoutName} for ${today}.` 
            });

          } else if (action === "get_history") {
            const history = db.logs.filter(log => log.workout_name === workoutName);
            
            if (history.length === 0) {
              return JSON.stringify({ message: `I couldn't find any past logs for ${workoutName}.` });
            }
            
            // Grab up to the last 3 workouts to show a trend for coaching
            const recentWorkouts = history.slice(-3); 
            return JSON.stringify({ 
              message: `Found your last ${recentWorkouts.length} sessions for ${workoutName}.`,
              data: recentWorkouts 
            });

          } else {
            return JSON.stringify({ error: "Invalid action specified." });
          }

        } catch (e) {
          console.error(e);
          return JSON.stringify({ error: `Failed to execute: ${e.message}` });
        }
      };
    </script>
  </body>
</html>
